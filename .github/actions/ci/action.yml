name: Run repo tool
description: Prepare the `wiki` image (local build, or GHCR pull) and run an optional tool command inside it.

inputs:
  mode:
    description: Image source — `local` (build here, no push) or `pull` (GHCR :latest).
    required: false
    default: local
  command:
    description: npm script to run inside the image (test, release, verify).
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Build image
      if: inputs.mode == 'local'
      shell: bash
      run: docker build --pull -t wiki --target remote-test -f Dockerfile .

    - name: Log into GHCR
      if: inputs.mode == 'pull'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Pull image
      if: inputs.mode == 'pull'
      shell: bash
      run: |
        docker pull "ghcr.io/${{ github.repository }}:latest"
        docker tag "ghcr.io/${{ github.repository }}:latest" wiki

    - name: Run tool command
      if: inputs.command != ''
      shell: bash
      run: |
        docker run --rm \
          -e GH_TOKEN="$GH_TOKEN" \
          -v "${{ github.workspace }}":/repo \
          wiki ${{ inputs.command }}
      env:
        GH_TOKEN: ${{ github.token }}
